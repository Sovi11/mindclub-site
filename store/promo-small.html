<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Store small promo tile, 440x280. Rendered to promo-small.png by store/shoot.mjs. -->
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:440px;height:280px;overflow:hidden}
  body{background:linear-gradient(180deg,#0c2a47 0%,#071321 100%);color:#e6f0fa;font-family:Inter,system-ui,sans-serif;padding:30px 32px;box-sizing:border-box;display:flex;flex-direction:column}
  .brand{font:700 38px/1 Silkscreen,monospace;text-shadow:-2px 0 rgba(255,111,159,.6),2px 0 rgba(56,212,242,.6)}
  .brand span{color:#38d4f2}
  .line{font:600 19px/1.3 Inter,sans-serif;margin-top:14px;max-width:340px}
  .chips{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
  .c{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:700 11px ui-monospace,Consolas,monospace;color:#fff}
  .toast{position:absolute;right:22px;bottom:26px;background:#0f9f6e;color:#fff;font:600 12px Inter;padding:6px 10px;border-radius:8px}
</style>
</head>
<body>
  <div class="toast">✓ Wordle 3/6 logged</div>
  <div class="brand">mind<span>club</span></div>
  <div class="line">Tap Share in your daily puzzle. It's logged.</div>
  <div class="chips">
    <div class="c" style="background:#6aaa64">W</div><div class="c" style="background:#9a83cf">C</div>
    <div class="c" style="background:#3e8fb0">S</div><div class="c" style="background:#4a6fd1">M</div>
    <div class="c" style="background:#d98a3a">Q</div>

  </div>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Store small promo tile, 440x280. Rendered to promo-small.png by store/shoot.mjs. -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:440px;height:280px;overflow:hidden}
  body{background:#1f1c17;color:#f3ede2;font-family:Inter,system-ui,sans-serif;padding:30px 32px;box-sizing:border-box;display:flex;flex-direction:column}
  .brand{font:700 40px/1 Fraunces,Georgia,serif;letter-spacing:-.02em}
  .brand span{color:#ff7a4d}
  .line{font:600 19px/1.3 Inter,sans-serif;margin-top:14px;max-width:340px}
  .chips{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
  .c{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:700 12px Fraunces,serif;color:#fff}
  .toast{position:absolute;right:22px;top:26px;background:#2f7d4f;color:#fff;font:600 12px Inter;padding:6px 10px;border-radius:8px}
</style>
</head>
<body>
  <div class="toast">✓ Wordle 3/6 logged</div>
  <div class="brand">mind<span>club</span></div>
  <div class="line">Tap Share in your daily puzzle. It's logged.</div>
  <div class="chips">
    <div class="c" style="background:#6aaa64">W</div><div class="c" style="background:#9a83cf">C</div>
    <div class="c" style="background:#3e8fb0">S</div><div class="c" style="background:#4a6fd1">M</div>
    <div class="c" style="background:#d98a3a">Q</div><div class="c" style="background:#b8931f">Z</div>
    <div class="c" style="background:#c4552b">Qd</div><div class="c" style="background:#c99a2e">Wf</div>
    <div class="c" style="background:#2f6db5">G</div>
  </div>
</body>
</html>

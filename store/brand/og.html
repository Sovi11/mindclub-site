<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:linear-gradient(180deg,#f5f8fb 0%,#e6f3f8 100%);color:#0d1b2a;font-family:Inter,sans-serif;display:grid;grid-template-columns:1.05fr 1fr;align-items:center;padding:0 80px;box-sizing:border-box;gap:56px}

  .card{background:#fff;border:1px solid #e2e8f0;border-radius:22px;padding:26px 28px;box-shadow:0 24px 60px rgba(13,27,42,.12)}

  .row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid #e2e8f0;font-size:24px}
  .row:first-of-type{border-top:0}
  .rk{font:600 18px 'JetBrains Mono',monospace;color:#64748b;width:18px}
  .rk.top{color:#e8457f}
  .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 17px Inter}
  .nm{flex:1;font-weight:500}
  .sc{font:600 22px 'JetBrains Mono',monospace}
  .me{background:#e0f4fa;border-radius:12px;padding:12px 10px;margin:0 -10px;border-top-color:transparent}
  .me + .row{border-top-color:transparent}
  .ch{margin-top:16px;background:#dcf5ea;color:#0f7a55;font:600 18px Inter;padding:12px 14px;border-radius:12px}
</style></head><body>
<div>
  <div class="brand">mind<span>club</span></div>

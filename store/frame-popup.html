<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Store screenshot 2 (1280x800): the real popup, captured by store/shoot.mjs as raw-popup.png, with a caption. -->
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@700&family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1280px;height:800px;overflow:hidden}
  body{background:#f5f8fb;color:#0d1b2a;font-family:Inter,system-ui,sans-serif;display:grid;grid-template-columns:1fr 1fr;align-items:center}
  .copy{padding:0 40px 0 96px}
  .brand{font:700 28px Silkscreen,monospace;text-shadow:-1.5px 0 rgba(232,69,127,.45),1.5px 0 rgba(8,145,178,.45)}
  .brand span{color:#0891b2}
  h1{font:700 52px/1.08 Inter,sans-serif;letter-spacing:-.03em;margin:22px 0 18px}
  p{font-size:20px;line-height:1.5;color:#64748b;margin:0;max-width:440px}
  .shot{display:flex;justify-content:center}
  .shot img{width:384px;border-radius:14px;box-shadow:0 24px 60px rgba(13,27,42,.16);border:1px solid #e2e8f0}
</style>
</head>
<body>
  <div class="copy">
    <div class="brand">mind<span>club</span></div>
    <h1>Every game, one click away.</h1>
    <p>The popup links to all 20 supported puzzles and shows what was logged from this browser today.</p>
  </div>
  <div class="shot"><img src="raw-popup.png" alt=""></div>
</body>
</html>

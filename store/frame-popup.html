<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Store screenshot 2 (1280x800): the real popup, captured by store/shoot.mjs as raw-popup.png, with a caption. -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1280px;height:800px;overflow:hidden}
  body{background:#f4efe6;color:#1d1a16;font-family:Inter,system-ui,sans-serif;display:grid;grid-template-columns:1fr 1fr;align-items:center}
  .copy{padding:0 40px 0 96px}
  .brand{font:700 28px Fraunces,Georgia,serif;letter-spacing:-.02em}
  .brand span{color:#e2552d}
  h1{font:700 54px/1.05 Fraunces,Georgia,serif;letter-spacing:-.02em;margin:22px 0 18px}
  p{font-size:20px;line-height:1.5;color:#7a7064;margin:0;max-width:440px}
  .shot{display:flex;justify-content:center}
  .shot img{width:384px;border-radius:14px;box-shadow:0 2px 0 rgba(0,0,0,.04),0 24px 60px rgba(60,40,10,.18);border:1px solid #e4dccd}
</style>
</head>
<body>
  <div class="copy">
    <div class="brand">mind<span>club</span></div>
    <h1>Every game, one click away.</h1>
    <p>The popup links to all 19 supported puzzles and shows what was logged from this browser today.</p>
  </div>
  <div class="shot"><img src="raw-popup.png" alt=""></div>
</body>
</html>
